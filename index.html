<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Acceso restringido</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0a0a0b;color:#e9e9ee;font-family:'Segoe UI',system-ui,sans-serif;padding:20px}
  .card{width:min(94vw,420px);background:#141418;border:1px solid #2b2b31;border-radius:20px;
    padding:44px 38px;text-align:center;
    box-shadow:0 0 0 1px rgba(255,214,10,.08),0 24px 70px rgba(0,0,0,.6)}
  .lock{font-size:52px;line-height:1}
  h1{font-size:21px;margin:16px 0 6px;font-weight:700;letter-spacing:-.2px}
  p{margin:0 0 24px;font-size:13.5px;color:#9a9aa4}
  form{display:flex;flex-direction:column;gap:12px}
  input{padding:15px 16px;border-radius:12px;border:1px solid #2b2b31;background:#0f0f12;
    color:#e9e9ee;font-size:16px;font-family:inherit;text-align:center;letter-spacing:.4px}
  input::placeholder{color:#6a6a72;letter-spacing:normal;font-size:14px}
  input:focus{outline:none;border-color:#ffd60a;box-shadow:0 0 0 3px rgba(255,214,10,.16)}
  button{padding:14px;border-radius:12px;border:none;background:#ffd60a;color:#0a0a0b;
    font-weight:800;font-size:14.5px;cursor:pointer;font-family:inherit;letter-spacing:.2px}
  button:hover{background:#ffcf00}
  button:disabled{opacity:.6;cursor:progress}
  .err{color:#ff6b6b;font-size:12.5px;font-weight:600;min-height:16px;margin-top:2px}
  .brand{margin-top:22px;font-size:11px;color:#55555f;letter-spacing:.3px}
</style></head>
<body>
  <div class="card">
    <div class="lock">🔒</div>
    <h1>Acceso restringido</h1>
    <p>Ingresa la clave para ver el panel.</p>
    <form id="f">
      <input id="k" type="password" placeholder="Clave de acceso" autocomplete="current-password" autofocus>
      <button id="b" type="submit">Entrar</button>
      <div class="err" id="e"></div>
    </form>
    <div class="brand">Castaño Panaderías · Supply Chain</div>
  </div>

const b2a=b64=>Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
async function descifrar(clave){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(clave),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b2a(SALT),iterations:ITER,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV)},key,b2a(CT));
  return new TextDecoder().decode(buf);
}
function mostrar(html){
  document.open(); document.write(html); document.close();
}
async function intentar(clave, guardar){
  const html=await descifrar(clave);           // lanza si la clave es incorrecta
  if(guardar){ try{ sessionStorage.setItem('cp_clave', clave); }catch(e){} }
  mostrar(html);
}
const f=document.getElementById('f'), k=document.getElementById('k'),
      b=document.getElementById('b'), e=document.getElementById('e');
f.addEventListener('submit', async ev=>{
  ev.preventDefault(); e.textContent=''; b.disabled=true;
  try{ await intentar(k.value, true); }
  catch(err){ e.textContent='Clave incorrecta.'; b.disabled=false; k.select(); }
});
// Auto-desbloqueo si ya se ingresó la clave en esta sesión del navegador
(async()=>{ try{ const c=sessionStorage.getItem('cp_clave');
  if(c){ await intentar(c, false); } }catch(err){ try{sessionStorage.removeItem('cp_clave');}catch(_){} } })();
