<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acceso restringido</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0a0a0b;color:#e9e9ee;font-family:'Segoe UI',system-ui,sans-serif;padding:20px}
  .card{width:min(94vw,470px);background:#ffd60a;color:#0a0a0b;border-radius:26px;
    padding:52px 44px;text-align:center;
    box-shadow:0 0 0 1px rgba(255,214,10,.5),0 30px 90px rgba(255,214,10,.22),0 24px 70px rgba(0,0,0,.65)}
  .lock{font-size:64px;line-height:1}
  h1{font-size:26px;margin:18px 0 6px;font-weight:800;letter-spacing:-.4px}
  p{margin:0 0 26px;font-size:14.5px;color:rgba(10,10,11,.72);font-weight:500}
  form{display:flex;flex-direction:column;gap:13px}
  input{padding:17px 18px;border-radius:14px;border:2px solid rgba(10,10,11,.16);background:#0f0f12;
    color:#fff;font-size:18px;font-family:inherit;text-align:center;letter-spacing:.5px}
  input::placeholder{color:#6a6a72;letter-spacing:normal;font-size:15px}
  input:focus{outline:none;border-color:#0a0a0b;box-shadow:0 0 0 4px rgba(10,10,11,.12)}
  button{padding:16px;border-radius:14px;border:none;background:#0a0a0b;color:#ffd60a;
    font-weight:800;font-size:15.5px;cursor:pointer;font-family:inherit;letter-spacing:.3px}
  button:hover{background:#1b1b20}
  button:disabled{opacity:.65;cursor:progress}
  .err{color:#7a1414;font-size:13px;font-weight:700;min-height:18px;margin-top:2px}
  .brand{margin-top:24px;font-size:11.5px;color:rgba(10,10,11,.55);letter-spacing:.4px;font-weight:600}
</style></head>
<body>
  <div class="card">
    <div class="lock">🔒</div>
    <h1>Acceso restringido</h1>
    <p>Ingresa la clave para ver el panel.</p>
    <form id="f">
      <input id="k" type="password" placeholder="Clave de acceso" autocomplete="current-password" autofocus>
      <button id="b" type="submit">Entrar</button>
      <div class="err" id="e"></div>
    </form>
    <div class="brand">Castaño Panaderías · Supply Chain</div>
  </div>

const b2a=b64=>Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
async function descifrar(clave){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(clave),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b2a(SALT),iterations:ITER,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV)},key,b2a(CT));
  return new TextDecoder().decode(buf);
}
function mostrar(html){
  document.open(); document.write(html); document.close();
}
async function intentar(clave, guardar){
  const html=await descifrar(clave);           // lanza si la clave es incorrecta
  if(guardar){ try{ sessionStorage.setItem('cp_clave', clave); }catch(e){} }
  mostrar(html);
}
const f=document.getElementById('f'), k=document.getElementById('k'),
      b=document.getElementById('b'), e=document.getElementById('e');
f.addEventListener('submit', async ev=>{
  ev.preventDefault(); e.textContent=''; b.disabled=true;
  try{ await intentar(k.value, true); }
  catch(err){ e.textContent='Clave incorrecta.'; b.disabled=false; k.select(); }
});
// Auto-desbloqueo si ya se ingresó la clave en esta sesión del navegador
(async()=>{ try{ const c=sessionStorage.getItem('cp_clave');
  if(c){ await intentar(c, false); } }catch(err){ try{sessionStorage.removeItem('cp_clave');}catch(_){} } })();
